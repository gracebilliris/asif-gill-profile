<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | escape }}">
    <meta name="theme-color" content="#081a33">
    <title>{{ page.title }} | Asif Gill</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
    <script src="{{ '/assets/script.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Asif Gill home">
        <span>AG</span> Asif Gill
      </a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Toggle navigation</span>
        <span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#work' | relative_url }}">Research</a>
        <a href="{{ '/publications.html' | relative_url }}">Publications</a>
        <a href="{{ '/#updates' | relative_url }}">Updates</a>
        <a href="{{ '/blog/' | relative_url }}">Writing</a>
      </nav>
    </header>
    <main id="main" class="article-page">
      <header>
        <p class="eyebrow">{{ page.category }} · {{ page.date | date: "%B %Y" }}</p>
        <h1>{{ page.title }}</h1>
        <p class="standfirst">{{ page.description }}</p>
      </header>
      <article class="article-body">
        {{ content }}
        <a class="article-back" href="{{ '/blog/' | relative_url }}">← Back to all writing</a>
      </article>
    </main>
    <footer class="site-footer shell">
      <p>© <span data-year></span> Asif Gill</p>
      <p>Professor · Researcher · Advisor</p>
      <a href="#main">Back to top ↑</a>
    </footer>
  </body>
</html>
