<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | escape }}">
    <meta name="theme-color" content="#ffffff">
    <title>{{ page.title }} · Asif Gill</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/simple.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="simple-header">
      <a class="simple-name" href="{{ '/' | relative_url }}">Asif Gill</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/books.html' | relative_url }}">Books</a>
        <a href="{{ '/publications.html' | relative_url }}">Publications</a>
        <a href="{{ '/blog/' | relative_url }}">Writing</a>
      </nav>
    </header>

    <main id="main" class="simple-main narrow article">
      <header class="simple-page-header">
        <p class="simple-meta">{{ page.date | date: "%B %Y" }} · {{ page.category }}</p>
        <h1>{{ page.title }}</h1>
        <p>{{ page.description }}</p>
      </header>
      <article class="article-content">
        {{ content }}
      </article>
      <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
    </main>

    <footer class="simple-footer">
      <p>© 2026 Asif Gill</p>
    </footer>
  </body>
</html>
